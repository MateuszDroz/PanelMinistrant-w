<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Check-in · Ministranci</title>
  <link rel="icon" type="image/png" href="/ikona.png">
  <link rel="apple-touch-icon" href="/ikona.png">
  <meta name="theme-color" content="#0a1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Check-in">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html{background:#0a1628;min-height:100%;min-height:100dvh}
    body{
      font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
      min-height:100vh;
      background:linear-gradient(160deg,#0a1628 0%,#1a2744 50%,#0d1b2a 100%);
      color:#fff;
      padding:24px 16px;
      padding-top:calc(24px + env(safe-area-inset-top,0px));
      padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .card{
      width:100%;max-width:400px;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      padding:28px 22px;
      box-shadow:0 12px 40px rgba(0,0,0,.35);
    }
    .icon{text-align:center;font-size:40px;margin-bottom:8px}
    h1{text-align:center;font-size:22px;margin-bottom:6px;font-weight:800}
    .sub{text-align:center;font-size:13px;color:rgba(255,255,255,.65);margin-bottom:20px;line-height:1.45}
    label{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.85);margin-bottom:4px}
    input{
      width:100%;padding:12px 14px;border-radius:10px;
      border:1px solid rgba(255,255,255,.2);
      background:rgba(0,0,0,.25);color:#fff;font-size:16px;
      margin-bottom:12px;font-family:inherit;
      -webkit-appearance:none;appearance:none;
    }
    input::placeholder{color:rgba(255,255,255,.35)}
    input:focus{outline:none;border-color:rgba(201,162,39,.7);background:rgba(0,0,0,.35)}
    button.primary{
      width:100%;padding:14px;border:none;border-radius:10px;
      background:#c9a227;color:#0a1628;
      font-weight:800;font-size:16px;cursor:pointer;
      margin-top:4px;font-family:inherit;
      transition:background .2s,transform .1s;
    }
    button.primary:hover{background:#d4b03a}
    button.primary:active{transform:scale(.98)}
    button.primary:disabled{opacity:.55;cursor:wait}
    button.opt{
      width:100%;padding:12px 14px;border-radius:10px;
      background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.3);
      color:#fff;font-weight:600;font-size:14px;
      cursor:pointer;text-align:left;font-family:inherit;
      transition:background .2s;
    }
    button.opt:hover{background:rgba(255,255,255,.18)}
    button.opt:active{background:rgba(255,255,255,.25)}
    #err{display:none;color:#ff8a9a;font-size:13px;font-weight:600;margin-bottom:10px;line-height:1.4}
    #ok{display:none;color:#7dffa0;font-size:14px;font-weight:600;margin-bottom:10px;line-height:1.45}
    #opcje-wrap{display:none;margin-bottom:12px}
    #opcje-wrap p{font-size:13px;font-weight:700;margin-bottom:8px}
    #opcje{display:flex;flex-direction:column;gap:8px}
    .foot{text-align:center;font-size:11px;color:rgba(255,255,255,.35);margin-top:16px;line-height:1.4}
    .geo-hint{font-size:12px;color:rgba(201,162,39,.9);text-align:center;margin-bottom:12px}
    #loader{
      display:none;text-align:center;margin:14px 0 0 0;
    }
    #loader .spinner{
      display:inline-block;width:22px;height:22px;
      border:3px solid rgba(255,255,255,.25);
      border-top-color:#c9a227;border-radius:50%;
      animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px;
    }
    #loader .txt{font-size:13px;color:rgba(255,255,255,.75);vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⛪</div>
    <h1>Check-in na Mszę</h1>
    <p class="sub">Wpisz tylko swoje ID — obecność zaliczy się po weryfikacji, że jesteś przy kościele (GPS).</p>
    <p class="geo-hint">📍 Wymagana lokalizacja w pobliżu kościoła</p>

    <form id="checkin-form" onsubmit="event.preventDefault(); wyslij();">
      <label for="cid">ID</label>
      <input
        type="text"
        id="cid"
        inputmode="numeric"
        pattern="[0-9]*"
        placeholder="Np. 1234"
        autocomplete="username"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        required>

      <div id="err"></div>
      <div id="ok"></div>

      <div id="opcje-wrap">
        <p>Wybierz nabożeństwo:</p>
        <div id="opcje"></div>
      </div>

      <button type="submit" class="primary" id="btn">Potwierdź obecność</button>
    </form>

    <div id="loader">
      <span class="spinner"></span><span class="txt" id="loader-txt">Łączenie z serwerem…</span>
    </div>

    <p class="foot">GPS musi być włączony. Check-in spoza terenu kościoła zostanie odrzucony.</p>
  </div>

  <script>
    // === URL wdrożenia GAS — ten sam co w index.html ===
    var GAS = "DANE_WRAŻLIWE";

    var errEl = document.getElementById("err");
    var okEl = document.getElementById("ok");
    var btnEl = document.getElementById("btn");
    var opcjeWrap = document.getElementById("opcje-wrap");
    var opcjeBox = document.getElementById("opcje");
    var loaderEl = document.getElementById("loader");
    var loaderTxt = document.getElementById("loader-txt");

    function showErr(m, warning) {
      errEl.style.display = "block";
      errEl.style.color = warning ? "#f5d76e" : "#ff8a9a";
      errEl.textContent = m || "";
      okEl.style.display = "none";
    }
    function showOk(m) {
      okEl.style.display = "block";
      okEl.textContent = m || "";
      errEl.style.display = "none";
      opcjeWrap.style.display = "none";
    }
    function hideAll() {
      errEl.style.display = "none";
      okEl.style.display = "none";
    }
    function setLoading(on, tekst) {
      loaderEl.style.display = on ? "block" : "none";
      if (tekst) loaderTxt.textContent = tekst;
    }
    function resetBtn() {
      btnEl.disabled = false;
      btnEl.textContent = "Potwierdź obecność";
    }

    function wyslij(kodWymuszony) {
      hideAll();
      if (!kodWymuszony) opcjeWrap.style.display = "none";

      var idEl = document.getElementById("cid");
      var id = String((idEl && idEl.value) || "").trim();
      if (!id) { showErr("Podaj swoje ID."); return; }

      btnEl.disabled = true;
      btnEl.textContent = "Pobieranie GPS…";
      setLoading(true, "Pobieranie lokalizacji GPS…");

      if (!navigator.geolocation) {
        resetBtn();
        setLoading(false);
        showErr("Ta przeglądarka nie obsługuje GPS. Użyj telefonu z lokalizacją.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          setLoading(true, "Zapisywanie obecności…");
          btnEl.textContent = "Zapisywanie…";

          var q = new URLSearchParams({
            action: "checkin",
            id: id,
            haslo: "",
            kod: kodWymuszony ? String(kodWymuszony) : "AUTO",
            lat: String(pos.coords.latitude),
            lng: String(pos.coords.longitude),
            accuracy: String(pos.coords.accuracy)
          });

          fetch(GAS + "?" + q.toString(), { method: "GET", redirect: "follow" })
            .then(function (r) { return r.text(); })
            .then(function (text) {
              resetBtn();
              setLoading(false);

              var res;
              try { res = JSON.parse(text); }
              catch (e) {
                showErr("Serwer zwrócił nieprawidłową odpowiedź. Sprawdź, czy URL wdrożenia GAS jest aktualny.");
                console.error("GAS response (nie JSON):", text.slice(0, 300));
                return;
              }

              // Kolizja nabożeństw → wybór
              if (res.blad === "wybor_wymagany" && res.opcje && res.opcje.length) {
                showErr(res.wiadomosc || "Wybierz nabożeństwo, na które przyszedłeś.", true);
                opcjeWrap.style.display = "block";
                opcjeBox.innerHTML = res.opcje.map(function (o) {
                  var kod = String(o.kod || "").replace(/'/g, "\\'");
                  var nazwa = String(o.nazwaLcd || o.nazwa || "Nabożeństwo").replace(/</g, "&lt;");
                  var pkt = (o.punkty != null ? o.punkty : "?");
                  return '<button type="button" class="opt" onclick="wyslij(\'' + kod + '\')">' +
                         nazwa + ' <span style="opacity:.75">(+' + pkt + ' pkt)</span></button>';
                }).join("");
                return;
              }

              // Sukces
              if (res.sukces) {
                showOk(res.wiadomosc ||
                  ("Zapisano: " + (res.wydarzenie || "") + " (+" + (res.punkty || 0) + " pkt). Suma: " + (res.suma || "?")));
                return;
              }

              // Błąd (np. brak mszy w oknie, brak GPS w bazie, ID nieznane…)
              showErr(res.wiadomosc || "Nie udało się zapisać obecności.");
            })
            .catch(function (e) {
              resetBtn();
              setLoading(false);
              showErr("Błąd połączenia z serwerem. Sprawdź internet i spróbuj ponownie.");
              console.error(e);
            });
        },
        function (err) {
          resetBtn();
          setLoading(false);
          var m = "Nie udało się pobrać lokalizacji. ";
          if (err && err.code === 1) m += "Zezwól na lokalizację dla tej strony.";
          else if (err && err.code === 2) m += "GPS niedostępny — wyjdź na zewnątrz i spróbuj ponownie.";
          else if (err && err.code === 3) m += "Timeout GPS — spróbuj ponownie.";
          else m += "Włącz lokalizację i spróbuj ponownie.";
          showErr(m);
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
      );
    }

    // Autofocus na polu ID (wygodne na telefonie)
    window.addEventListener("load", function () {
      var idEl = document.getElementById("cid");
      if (idEl && !idEl.value) {
        setTimeout(function () { try { idEl.focus(); } catch (e) {} }, 250);
      }
    });
  </script>
</body>
</html>
